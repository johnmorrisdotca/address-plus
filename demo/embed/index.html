<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>Address Plus · form field</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import "../lib/element-define.js";
      import { ADDRESS_FIELD_COUNTRIES } from "../lib/element.js";
      const query = new URLSearchParams(location.search),
        field = document.createElement("address-field");
      field.setAttribute("size", "medium");
      for (const [name, choices] of [
        ["country", ["auto", ...ADDRESS_FIELD_COUNTRIES]],
        ["lang", ["en", "ja"]],
        ["theme", ["auto", "light", "dark"]],
        ["size", ["small", "medium", "large"]],
      ])
        if (choices.includes(query.get(name))) field.setAttribute(name, query.get(name));
      const width = query.get("width");
      if (width !== null && /^\d+$/.test(width) && Number(width) >= 100 && Number(width) <= 2000)
        field.setAttribute("width", width);
      for (const name of ["required", "disabled", "readonly", "validate"])
        if (
          query.has(name) &&
          ["", "true", "on", "1", "false", "off", "no", "0"].includes(query.get(name).trim().toLowerCase())
        )
          field.setAttribute(name, query.get(name));
      for (const name of ["label", "name"]) {
        const value = query.get(name);
        if (value !== null && value.length <= 200) field.setAttribute(name, value);
      }
      if (query.get("lang") === "ja") document.documentElement.lang = "ja";
      for (const type of ["address-plus-load", "address-plus-change", "address-plus-error"])
        field.addEventListener(type, (event) => {
          if (parent !== window)
            parent.postMessage({ type: event.type, detail: JSON.parse(JSON.stringify(event.detail)) }, "*");
        });
      document.body.append(field);
    </script>
  </body>
</html>
