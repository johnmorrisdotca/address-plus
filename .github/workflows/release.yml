name: Release
# Run by hand (Actions > Release > Run workflow) from main, or push a v<version> tag. The steps are kazoku-ui's shared
# release workflow (docs/release-workflow.md there): it refuses unless the CI workflow has succeeded on this commit,
# checks the tag against package.json, runs `pnpm check`, tags, and publishes to npm by trusted publishing, with
# provenance. The GitHub release page (its notes are the CHANGELOG's) is made by the same run.
# npm trusts this file by name (npmjs.com > the package > Settings > Trusted Publisher: release.yml), so publishing
# needs no token and no secret.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
  id-token: write
jobs:
  release:
    uses: johnmorrisdotca/kazoku-ui/.github/workflows/reusable-release.yml@v0.10.1
    with:
      require-ci-workflow: ci.yml
      github-release: true
